# Report engine configuration.
#
# Keys marked TUNABLE in the brief are starting values. Changing one means
# recording the old value, the new value and a reason in decisions.md.

report:
  type: full
  page_size: A4
  max_image_dimension: 1200        # TUNABLE - longest edge in px before embedding

provenance:                        # stamped into every page footer and the manifest (5.6)
  engine_version: "0.1.0"
  template_version: full_report_v1

manifest:
  version: "1.0"                  

paths:
  path_prefix: /run-files          # stripped from evidence_images before joining evidence_root

sensor:
  max_age_seconds: 120             # TUNABLE - above this a reading renders flagged stale
  subsystem_flags:                 # raw flag -> the sensor block it governs
    adxl345_ok: accelerometer
    bme680_ok: environment
    sps30_ok: particulate

units:                             # measurement field -> the unit it is printed in

decimals: # measurement field -> decimal places it prints to
  temperature_c: 2
  humidity_pct: 2
  pressure_hpa: 2
  vibration_peak: 3
  vibration_rms_g: 3
  accel_x: 3
  accel_y: 3
  accel_z: 3
  x: 3
  y: 3
  z: 3
  yaw: 3

evidence:
  grid_columns: 4                # most cells on a row; a checkpoint with fewer uses fewer
  thermal_suffix: _thermal       # filename marker for a thermal image
  rgb_suffix: _rgb               # filename marker for an RGB image; unmarked is RGB too

sections:
  cover: true
  coverage: true
  findings: true
  alerts: true
  zone_telemetry: true
  checkpoints: true
  summary: true

branding:
  stylesheet: styles.css           # a file in src/report/templates/: styles.css or style_default.css
  logo_path: config/assets/logo.png
  primary_colour: "#1F3864"
  footer_text: "Prepared by FacilityOps.AI"
