# tenant to facility mapping
#
# Read only by src/query/scope.py. Each tenant maps to the facility_ids it
# owns. Only the tenant's own facility folders are read, and a record still
# belongs to a tenant by the facility_id inside it, not by the folder it sits
# in: a run in the wrong folder is dropped, never shown. A facility listed
# under two tenants is an ambiguous mapping and is refused, never guessed.

data_dir: data_tenant              # the tenant corpus, relative to the project root
record_patterns:                   # {facility_id} is filled with each facility the tenant may see
  - "{facility_id}/*/run.json"     # data_tenant/<facility_id>/<run>/run.json

# One tenant per facility. The sim_ tenants are simulator output with
# fabricated readings.
tenants:
  tenant_facility:
    facility_ids: [sis_facility_checkpoint_route]
  tenant_racks:
    facility_ids: [sis_racks_checkpoint_route]
  se4_clubhouse_checkpoint_route:
    facility_ids: [se4_clubhouse_checkpoint_route]
  stretch3_checkpoint_route:
    facility_ids: [stretch3_checkpoint_route]
  facility_ops:
    facility_ids: [facility_ops]
  sim_facility_001:
    facility_ids: [sim_facility_001]
  sim_facility_002:
    facility_ids: [sim_facility_002]
  sim_facility_facilityops:
    facility_ids: [sim_facility_facilityops]
