[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facilityops-report"
version = "1.0.0"
description = "PDF report engine for facility inspection run records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2==3.1.4",
    "weasyprint==62.3",
    # Pinned explicitly although weasyprint pulls it in: weasyprint 62.3 calls a
    # pydyf API that pydyf 0.11 changed, so an unpinned install breaks at
    # write_pdf. Deliverable 2 requires exact versions, transitive ones included.
    "pydyf==0.10.0",
    "pyyaml==6.0.2",
    "pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pypdf==6.18.1",
]

[project.scripts]
#facilityops-report = "report.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/report"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]