# Labels for the question sets' questions, for training the routers.
# Written by router.label_question_set. Edit any label you disagree with;
# 'from' says whether the question set or the model gave it.
labels:
- id: Q01
  question: a3_front inspection on the most recent run
  first_step: lookup
  second_step: checkpoints
  from: claude-haiku-5-5
  reason: Asks for the recorded status and verdict of a named checkpoint on a run,
    which is read straight from the checkpoints table.
- id: Q02
  question: Show me the evidence captured at ac_2 on the most recent run.
  first_step: lookup
  second_step: evidence
  from: claude-haiku-5-5
  reason: Asks for the image files captured at a named checkpoint, which the evidence
    table holds as recorded.
- id: Q03
  question: Which checkpoint recorded the highest vibration in the most recent run?
  first_step: derivation
  second_step: group_max
  from: question set
  reason: requires_derivations
- id: Q04
  question: How many checkpoints exceeded the temperature threshold on the most recent
    run?
  first_step: derivation
  second_step: threshold_compare
  from: claude-haiku-5-5
  reason: Counts checkpoints whose temperature reading went over a configured limit,
    so it is a reading-against-limit comparison.
- id: Q05
  question: What proportion of checkpoints on the most recent run completed?
  first_step: derivation
  second_step: proportion
  from: question set
  reason: requires_derivations
