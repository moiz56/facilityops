  - image resolution rate
  description: null
  confidence_threshold: null
  metadata: {}
- name: group_mean
  utterances:
  - Which zone had the highest average vibration?
  - noisiest zone on average
  - which area averages the most vibration
  - Which zone had the highest average temperature?
  - hottest zone on average
  - which area runs warmest
  description: null
  confidence_threshold: null
  metadata: {}
- name: group_max
  utterances:
  - Which checkpoint recorded the highest vibration in the most recent run?
  - highest vibration last run
  - where was vibration worst
  - Which checkpoint recorded the highest temperature?
  - hottest checkpoint
  - where was it warmest
  description: null
  confidence_threshold: null
  metadata: {}
- name: rank_top_n
  utterances:
  - List the five highest vibration readings on the most recent run.
  - top 5 vibration
  - worst five vibration readings
  description: null
  confidence_threshold: null
  metadata: {}
- name: run_set_difference
  utterances:
  - What is different between the two most recent runs?
  - what changed since last time
  - diff the last two runs
  - Which checkpoints failed on both of the last two runs?
  - repeat failures
  - what failed twice in a row
  - Which checkpoints appear in the most recent run but not the previous one?
  - new checkpoints this run
  - what's in this run that wasn't in the last
  - Which findings are new since the previous run?
  - new issues this time
  - what's come up since last run
  - Which findings appear in both of the last two runs?
  - recurring findings
  - what keeps showing up
  - How did coverage change between the last two runs?
  - coverage difference between runs
  - did we capture more or less this time
  - Which sensor blocks were available last run but not this one?
  - did any sensors drop out
  - sensors working last time but not now
