router_type: indexed
encoder:
  type: fastembed
  name: BAAI/bge-small-en-v1.5
sparse_encoder: null
alpha: 0.7
top_k: 5
aggregation: mean
index:
  type: local
confidence_threshold: 0.6
calibrator:
  method: platt
  params:
    a:
    - 9.604074998802698
    b:
    - -6.995840239603564
refresh_interval: null
routes:
- name: threshold_compare
  utterances:
  - How many checkpoints exceeded the temperature threshold on the most recent run?
  - how many ran hot
  - checkpoints over the temp limit
  description: null
  confidence_threshold: null
  metadata: {}
- name: condition_count
  utterances:
  - How many findings were recorded on the most recent run, by status?
  - findings breakdown last run
  - how many findings and what state are they in
  - Have any checkpoints been missed on the first run?
  - recurring misses
  - checkpoints we keep missing
  - Are there any findings marked abstained along with where?
  - anything needing review
  - abstained findings
  - How many checkpoints failed on the most recent run?
  - how many failures last run
  - count the fails
  - How many sensor alerts were logged, by severity?
  - alert breakdown
  - how many critical alerts
  - How many findings were recorded, by feature?
  - findings grouped by type
  - what kinds of issues came up
  - Which checkpoints captured no evidence?
  - where are we missing photos
  - checkpoints with no images
  - Do the declared counts match the checkpoints in the record?
  - does the record add up
  - any count mismatches
  - Which findings have no configured action?
  - anything we don't know how to handle
  - unmapped findings
  description: null
  confidence_threshold: null
  metadata: {}
- name: proportion
  utterances:
  - What proportion of checkpoints on the most recent run completed?
  - how much of the route did we finish
  - completion rate last run
  - What proportion of referenced images resolved?
